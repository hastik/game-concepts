    let nearRiver = false;
    for (let dy = -1; dy <= d.h; dy++) for (let dx = -1; dx <= d.w; dx++) {
      const x = tx + dx, y = ty + dy;
      if (inBounds(x, y) && state.map.terrain[y * MAP_W + x] === 'water') nearRiver = true;
    }
    b.riverBonus = nearRiver;
  }
  state.buildings.push(b);
  sfxBuild(); spawnDust(tx + d.w / 2, ty + d.h / 2);
  checkMilestones();
  return true;
}

function demolishAt(tx, ty) {
  if (state.map.roads[ty * MAP_W + tx]) {
    state.map.roads[ty * MAP_W + tx] = 0; pathCache.clear(); sfxDemolish(); return;
  }
  const b = buildingAt(tx, ty);
  if (!b) return;
  const d = BUILD_DEFS[b.type];
  const ret = Math.floor(d.cost * BALANCE.demolishReturn);
  state.cash += ret;
  state.buildings = state.buildings.filter(x => x.id !== b.id);
  for (const t of state.trucks) {
    if (t.route) t.route = t.route.filter(s => s.bId !== b.id);
  }
  if (ui.selectedId === b.id) ui.selectedId = null;
  sfxDemolish(); toast('Demolice: +' + fmtMoney(ret));
}

function tickDay() {
  if (!state || state.bankrupt) return;
  const q = seasonOf(state.month);
  for (const b of state.buildings) {
    const d = BUILD_DEFS[b.type];
    if (!d) continue;
    b.blocked = false; b.missing = false;
    if (d.cat === 'prod') {
      let rate = d.rate / 30;
      if (b.type === 'farm_wheat') {
        rate *= (q === 1 ? 1.5 : q === 3 ? 0.5 : 1.0);
        if (b.riverBonus) rate *= BALANCE.wheatRiverBonus;
      }
      const cur = b.storage[d.out] || 0;
      if (cur >= d.storageOut) { b.blocked = true; continue; }
      b.accOut += rate;
      const whole = Math.floor(b.accOut);
      if (whole > 0) {
        const add = Math.min(whole, d.storageOut - cur);
        b.storage[d.out] = cur + add; b.accOut -= add;
      }
    } else if (d.cat === 'proc') {
      const rate = d.rate / 30;
      const curIn = b.storage[d.in] || 0;
      const curOut = b.storage[d.out] || 0;
      if (curOut >= d.storageOut) { b.blocked = true; continue; }
      if (curIn < 1) { b.missing = true; continue; }
      const canOut = Math.min(rate, d.storageOut - curOut);
      const inNeeded = (canOut / d.outPer) * d.inPer;
      const take = Math.min(curIn, inNeeded);
      b.storage[d.in] = curIn - take;
      b.accOut += (take / d.inPer) * d.outPer;
      const whole = Math.floor(b.accOut);
      if (whole > 0) {
        const add = Math.min(whole, d.storageOut - curOut);
        b.storage[d.out] = curOut + add; b.accOut -= add;
        if (d.out === 'bread') state.stats.madeBread += add;
      }
    }
  }
  autoTransfer();
  sellDay();
  tickTrucks();
  state.day++;
  if (state.day > 30) {
    state.day = 1;
    endMonth();
    state.month++;
    if (state.month > 11) { state.month = 0; state.year++; }
    if (state.month % 3 === 0) endQuarter();
  }
  checkMilestones();
}

function endMonth() {
  let maint = 0;
  for (const b of state.buildings) { const d = BUILD_DEFS[b.type]; if (d) maint += d.maint; }
  let roadCount = 0;
  for (let i = 0; i < state.map.roads.length; i++) if (state.map.roads[i]) roadCount++;
  maint += roadCount * BUILD_DEFS.road.maint;
  maint += state.trucks.length * BALANCE.truckMaint;
  state.cash -= maint;
  state.stats.monthMaint = maint;
  const profit = state.stats.monthIncome - maint - state.stats.monthBuild;
  state.stats.lastMonthProfit = profit;
  state.stats.history.push({ income: state.stats.monthIncome, maint, build: state.stats.monthBuild, profit });
  if (state.stats.history.length > 12) state.stats.history.shift();
  for (const p of ['bread', 'eggs', 'milk']) {
    const dem = state.stats.demandAcc[p] || 0;
    const ful = state.stats.fulfilled[p] || 0;
    const sat = dem > 0 ? ful / dem : 0.5;
    state.stats.satHistory[p].push(sat);
    if (state.stats.satHistory[p].length > 3) state.stats.satHistory[p].shift();
    state.stats.fulfilled[p] = 0;
    state.stats.demandAcc[p] = 0;
  }
  state.stats.monthIncome = 0;
  state.stats.monthBuild = 0;
  if (state.cash < BALANCE.bankruptThreshold) {
    state.stats.bankruptStreak++;
    if (state.stats.bankruptStreak >= BALANCE.bankruptMonths) {
      state.bankrupt = true; state.speed = 0;
      toast('Bankrot! Hotovost příliš dlouho v minusu.');
    }
  } else state.stats.bankruptStreak = 0;
}

function endQuarter() {
  let avgSat = 0, n = 0;
  for (const p of ['bread', 'eggs', 'milk']) {
    const h = state.stats.satHistory[p];
    if (h.length) { avgSat += h.reduce((a,b)=>a+b,0)/h.length; n++; }
  }
  avgSat = n ? avgSat / n : 0.5;
  let growth = state.pop * 0.05 * (avgSat - 0.5) * 2;
  const minDrop = -state.pop * 0.03;
  if (growth < minDrop) growth = minDrop;
  state.pop = Math.max(500, Math.floor(state.pop + growth));
  updateHouses();
  autosave();
}

function updateHouses() {
  const target = Math.min(12, 6 + Math.floor((state.pop - 1200) / 200));
  const map = state.map;
  const housePos = [[0,0],[2,0],[4,0],[6,0],[0,2],[2,2],[4,2],[6,2],[0,4],[2,4],[4,4],[6,4]];
  while (map.houses.length < target && map.houses.length < housePos.length) {
    const i = map.houses.length;
    const [hx, hy] = housePos[i];
    map.houses.push({ x: map.cityX + hx, y: map.cityY + hy, v: i % 6, active: true });
  }
}

function monthlyDemand(product) {
  const q = seasonOf(state.month);
  const base = state.pop * BALANCE.perCapita[product] * BALANCE.seasonMult[product][q];
  const p = state.prices[product];
  return base * Math.max(0, 1.5 - 0.5 * p);
}

function sellDay() {
  const shops = state.buildings.filter(b => b.type === 'shop');
  if (!shops.length) return;
  for (const product of ['bread', 'eggs', 'milk']) {
    const dayDemand = monthlyDemand(product) / 30;
    state.stats.demandAcc[product] += dayDemand;
    let left = dayDemand;
    for (const shop of shops) {
      if (left <= 0) break;
      const have = shop.storage[product] || 0;
      const sold = Math.min(have, left);
      if (sold > 0) {
        shop.storage[product] = have - sold;
        const income = sold * BALANCE.basePrice[product] * state.prices[product];
        state.cash += income;
        state.stats.monthIncome += income;
        state.stats.fulfilled[product] += sold;
        if (product === 'eggs') state.stats.soldEggs += sold;
        left -= sold;
        if (Math.random() < 0.15) spawnCoin(shop.x + 1, shop.y);
      }
    }
  }
}

function storageTotal(b) {
  let t = 0; for (const k of Object.keys(b.storage)) t += b.storage[k] || 0; return t;
}

function roomFor(b, product) {
  const d = BUILD_DEFS[b.type];
  if (d.storageAll) return Math.max(0, d.storageAll - storageTotal(b));
  if (d.in === product) return Math.max(0, d.storageIn - (b.storage[product] || 0));
  if (d.out === product) return Math.max(0, d.storageOut - (b.storage[product] || 0));
  if (d.sells && d.sells.includes(product)) return Math.max(0, d.storageAll - storageTotal(b));
  return 0;
}

function autoTransfer() {
  const range = BALANCE.autoRange, maxT = BALANCE.autoTransferPerDay;
  const producers = state.buildings.filter(b => {
    const c = BUILD_DEFS[b.type].cat; return c === 'prod' || c === 'proc';
  });
  for (const src of producers) {
    const d = BUILD_DEFS[src.type];
    if (!d.out) continue;
    const product = d.out;
    let avail = src.storage[product] || 0;
    if (avail <= 0) continue;
    const targets = [];
    for (const dst of state.buildings) {
      if (dst.id === src.id) continue;
      const dd = BUILD_DEFS[dst.type];
      const dist = manhattanEdge(src.x, src.y, d.w, d.h, dst.x, dst.y, dd.w, dd.h);
      if (dist > range) continue;
      let prio = 99;
      if (dd.in === product) prio = 1;
      else if (dd.sells && dd.sells.includes(product)) prio = 2;
      else if (dst.type === 'warehouse') prio = 3;
      else continue;
      targets.push({ dst, dist, prio });
    }
    targets.sort((a, b) => a.prio - b.prio || a.dist - b.dist);
    let left = Math.min(avail, maxT);
    for (const t of targets) {
      if (left <= 0) break;
      const move = Math.min(left, roomFor(t.dst, product));
      if (move > 0) {
        src.storage[product] -= move;
        t.dst.storage[product] = (t.dst.storage[product] || 0) + move;
        left -= move;
      }
    }
  }
  for (const wh of state.buildings.filter(b => b.type === 'warehouse')) {
    for (const product of ['wheat', 'flour', 'bread', 'eggs', 'milk']) {
      let avail = wh.storage[product] || 0;
      if (avail <= 0) continue;
      const targets = [];
      for (const dst of state.buildings) {
        if (dst.id === wh.id) continue;
        const dd = BUILD_DEFS[dst.type];
        const dist = manhattanEdge(wh.x, wh.y, 3, 2, dst.x, dst.y, dd.w, dd.h);
        if (dist > range) continue;
        let prio = 99;
        if (dd.in === product) prio = 1;
        else if (dd.sells && dd.sells.includes(product)) prio = 2;
        else continue;
        targets.push({ dst, dist, prio });
      }
      targets.sort((a,b)=>a.prio-b.prio||a.dist-b.dist);
      let left = Math.min(avail, maxT);
      for (const t of targets) {
        if (left <= 0) break;
        const move = Math.min(left, roomFor(t.dst, product));
        if (move > 0) {
          wh.storage[product] -= move;
          t.dst.storage[product] = (t.dst.storage[product] || 0) + move;
          left -= move;
        }
      }
    }
  }
}

function roadMask(x, y) {
  if (!state.map.roads[y * MAP_W + x]) return 0;
  let m = 0;
  if (y > 0 && state.map.roads[(y-1)*MAP_W+x]) m |= 1;
  if (x < MAP_W-1 && state.map.roads[y*MAP_W+x+1]) m |= 2;
  if (y < MAP_H-1 && state.map.roads[(y+1)*MAP_W+x]) m |= 4;
  if (x > 0 && state.map.roads[y*MAP_W+x-1]) m |= 8;
  return m;
}
function waterMask(x, y) {
  if (state.map.terrain[y * MAP_W + x] !== 'water') return 0;
  let m = 0;
  if (y > 0 && state.map.terrain[(y-1)*MAP_W+x] === 'water') m |= 1;
  if (x < MAP_W-1 && state.map.terrain[y*MAP_W+x+1] === 'water') m |= 2;
  if (y < MAP_H-1 && state.map.terrain[(y+1)*MAP_W+x] === 'water') m |= 4;
  if (x > 0 && state.map.terrain[y*MAP_W+x-1] === 'water') m |= 8;
  return m;
}
function buildingRoadTiles(b) {
  const d = BUILD_DEFS[b.type];
  const tiles = [], seen = new Set();
  for (let dy = 0; dy < d.h; dy++) for (let dx = 0; dx < d.w; dx++) {
    const x = b.x + dx, y = b.y + dy;
    for (const [ox, oy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
      const rx = x + ox, ry = y + oy;
      if (inBounds(rx, ry) && state.map.roads[ry * MAP_W + rx]) {
        const k = rx + ',' + ry;
        if (!seen.has(k)) { seen.add(k); tiles.push({ x: rx, y: ry }); }
      }
    }
  }
  return tiles;
}
function bfsPath(sx, sy, gx, gy) {
  const key = sx+','+sy+'>'+gx+','+gy;
  if (pathCache.has(key)) return pathCache.get(key);
  if (!state.map.roads[sy*MAP_W+sx] || !state.map.roads[gy*MAP_W+gx]) {
    pathCache.set(key, null); return null;
  }
  const q = [[sx, sy]];
  const prev = new Map(); prev.set(sx+','+sy, null);
  let found = false;
  while (q.length) {
    const [x, y] = q.shift();
    if (x === gx && y === gy) { found = true; break; }
    for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
      const nx = x + dx, ny = y + dy, k = nx+','+ny;
      if (!inBounds(nx, ny) || prev.has(k)) continue;
      if (!state.map.roads[ny * MAP_W + nx]) continue;
      prev.set(k, [x, y]); q.push([nx, ny]);
    }
  }
  if (!found) { pathCache.set(key, null); return null; }
  const path = []; let cur = [gx, gy];
  while (cur) { path.push({ x: cur[0], y: cur[1] }); cur = prev.get(cur[0]+','+cur[1]); }
  path.reverse(); pathCache.set(key, path); return path;
}

function buyTruck(depot) {
  if (state.trucks.length >= BALANCE.maxTrucks) { toast('Max 10 náklaďáků'); sfxError(); return; }
  if (state.cash < BALANCE.truckPrice) { toast('Nedostatek peněz'); sfxError(); return; }
  state.cash -= BALANCE.truckPrice;
  state.stats.monthBuild += BALANCE.truckPrice;
  const tiles = buildingRoadTiles(depot);
  const start = tiles[0] || { x: depot.x, y: depot.y };
  state.trucks.push({
    id: state.nextId++, depotId: depot.id,
    x: start.x, y: start.y, fx: start.x, fy: start.y,
    cargo: null, amount: 0, route: [], stopIdx: 0,
    path: [], pathIdx: 0, waitFull: false, state: 'idle', wait: 0, dir: 'down', frame: 0
  });
  toast('Náklaďák koupen! Nastav trasu (T).');
  sfxCash(); checkMilestones();
}

function tickTrucks() {
  for (const t of state.trucks) {
    if (!t.route || t.route.length < 2) continue;
    if (t.wait > 0) { t.wait--; continue; }
    if (t.state === 'idle' || t.state === 'load' || t.state === 'unload') {
      const stop = t.route[t.stopIdx];
      const b = state.buildings.find(x => x.id === stop.bId);
      if (!b) { t.stopIdx = (t.stopIdx + 1) % t.route.length; continue; }
      if (stop.action === 'load' && stop.product) {
        const room = BALANCE.truckCap - t.amount;
        const have = b.storage[stop.product] || 0;
        let take = Math.min(room, have);
        if (t.waitFull && t.amount + take < BALANCE.truckCap && have > 0) {
          if (take > 0) { b.storage[stop.product] = have - take; t.cargo = stop.product; t.amount += take; }
          t.wait = 1; t.state = 'load'; continue;
        }
        if (take > 0) {
          b.storage[stop.product] = have - take; t.cargo = stop.product; t.amount += take;
          t.wait = BALANCE.truckLoadDays; t.state = 'load'; continue;
        }
      } else if (stop.action === 'unload' && t.amount > 0 && t.cargo) {
        const give = Math.min(t.amount, roomFor(b, t.cargo));
        if (give > 0) {
          b.storage[t.cargo] = (b.storage[t.cargo] || 0) + give;
          t.amount -= give;
          if (t.amount <= 0) { t.cargo = null; t.amount = 0; }
          t.wait = BALANCE.truckLoadDays; t.state = 'unload';
          beep(440, 0.05, 'square', 0.05); continue;
        }
      }
      t.stopIdx = (t.stopIdx + 1) % t.route.length;
      const next = t.route[t.stopIdx];
      const nb = state.buildings.find(x => x.id === next.bId);
      if (!nb) continue;
      const fromTiles = buildingRoadTiles(b);
      const toTiles = buildingRoadTiles(nb);
      let best = null;
      for (const a of fromTiles) for (const c of toTiles) {
        const p = bfsPath(a.x, a.y, c.x, c.y);
        if (p && (!best || p.length < best.length)) best = p;
      }
      if (!best) {
        for (const c of toTiles) {
          const p = bfsPath(Math.round(t.fx), Math.round(t.fy), c.x, c.y);
          if (p && (!best || p.length < best.length)) best = p;
        }
      }
      if (best && best.length) { t.path = best; t.pathIdx = 0; t.state = 'move'; }
      else t.wait = 2;
      continue;
    }
    if (t.state === 'move') {
      let move = BALANCE.truckSpeed;
      while (move > 0 && t.pathIdx < t.path.length - 1) {
        t.pathIdx++;
        const p = t.path[t.pathIdx];
        const ox = t.fx, oy = t.fy;
        t.fx = p.x; t.fy = p.y; t.x = p.x; t.y = p.y;
        if (p.x > ox) t.dir = 'right';
        else if (p.x < ox) t.dir = 'left';
        else if (p.y > oy) t.dir = 'down';
        else if (p.y < oy) t.dir = 'up';
        move--;
      }
      if (t.pathIdx >= t.path.length - 1) { t.state = 'idle'; t.path = []; }
    }
  }
}

function checkMilestones() {
  for (const m of MILESTONES) {
    if (state.milestonesDone[m.id]) continue;
    if (m.check(state)) {
      state.milestonesDone[m.id] = true;
      state.cash += m.bonus;
      if (m.unlock) state.unlocked[m.unlock] = true;
      if (m.victory) state.victory = true;
      sfxMilestone();
      toast('Milník: ' + m.text + ' (+' + fmtMoney(m.bonus) + ')');
      spawnConfetti();
    }
  }
}

function spawnDust(tx, ty) { ui.effects.push({ type: 'dust', x: tx * TILE, y: ty * TILE, t0: performance.now(), life: 300 }); }
function spawnCoin(tx, ty) { ui.effects.push({ type: 'coin', x: (tx + 0.5) * TILE, y: ty * TILE, t0: performance.now(), life: 800 }); }
function spawnConfetti() { ui.effects.push({ type: 'confetti', x: ui.camX / ui.zoom + 200, y: ui.camY / ui.zoom + 100, t0: performance.now(), life: 500 }); }

function serialize() {
  return JSON.stringify({
    cash: state.cash, day: state.day, month: state.month, year: state.year,
    speed: state.speed, pop: state.pop, buildings: state.buildings,
    trucks: state.trucks.map(t => ({
      id: t.id, depotId: t.depotId, x: t.x, y: t.y, fx: t.fx, fy: t.fy,
      cargo: t.cargo, amount: t.amount, route: t.route, stopIdx: t.stopIdx,
      waitFull: t.waitFull, state: t.state, wait: t.wait, dir: t.dir
    })),
    nextId: state.nextId,
    map: {
      terrain: state.map.terrain, trees: state.map.trees,
      cityX: state.map.cityX, cityY: state.map.cityY,
      houses: state.map.houses, shopSlots: state.map.shopSlots,
      paths: state.map.paths, roads: state.map.roads
    },
    unlocked: state.unlocked, milestonesDone: state.milestonesDone,
    stats: state.stats, prices: state.prices, victory: state.victory, bankrupt: state.bankrupt
  });
}
function saveGame(quiet) {
  try { localStorage.setItem(SAVE_KEY, serialize()); if (!quiet) toast('Hra uložena'); }
  catch (e) { if (!quiet) toast('Uložení selhalo'); }
}
function autosave() {
  try {
    const data = serialize();
    localStorage.setItem(SAVE_KEY, data);
    localStorage.setItem(SAVE_KEY + '-quarter', data);
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    state = JSON.parse(raw);
    for (const t of state.trucks) {
      t.path = []; t.pathIdx = 0; t.frame = 0;
      if (t.fx == null) { t.fx = t.x; t.fy = t.y; }
    }
    ui.menuOpen = false; pathCache.clear();
    toast('Hra načtena'); startMusic(); return true;
  } catch (e) { toast('Načtení selhalo'); return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

function clampCam() {
  const maxX = MAP_W * TILE * ui.zoom - canvas.width + 200;
  const maxY = MAP_H * TILE * ui.zoom - canvas.height + 200;
  ui.camX = Math.max(-100, Math.min(maxX, ui.camX));
  ui.camY = Math.max(-100, Math.min(maxY, ui.camY));
}
function screenToWorld(sx, sy) { return { x: (sx + ui.camX) / ui.zoom, y: (sy + ui.camY) / ui.zoom }; }
function screenToTile(sx, sy) {
  const w = screenToWorld(sx, sy);
  return { tx: Math.floor(w.x / TILE), ty: Math.floor(w.y / TILE) };
}
function drawSpritePivot(name, tileX, tileY, fw, fh) {
  const spr = S().SPRITES[name]; if (!spr) return;
  const scale = ui.zoom;
  const screenX = tileX * TILE * scale + (fw * TILE * scale - spr.w * scale) / 2 - ui.camX;
  const screenY = tileY * TILE * scale + fh * TILE * scale - spr.h * scale - ui.camY;
  S().drawSprite(ctx, name, screenX, screenY, scale);
}
function drawShadow(tileX, tileY, fw, fh) {
  if (!DEFAULTS.buildingShadows) return;
  const scale = ui.zoom;
  const cx = tileX * TILE * scale + (fw * TILE * scale) / 2 - ui.camX;
  const cy = tileY * TILE * scale + fh * TILE * scale - 4 * scale - ui.camY;
  ctx.fillStyle = 'rgba(40,30,40,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, fw * TILE * scale * 0.4, fh * TILE * scale * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
}

function render() {
  const Spr = S();
  const W = canvas.width, H = canvas.height;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = Spr.PALETTE.sky;
  ctx.fillRect(0, 0, W, H);
  if (!state) { drawMenu(); return; }

  const q = seasonOf(state.month);
  const season = ['spring', 'summer', 'autumn', 'winter'][q];
  const grassKey = 'grass_' + season + '_0';
  const scale = ui.zoom;
  const x0 = Math.max(0, Math.floor(ui.camX / (TILE * scale)) - 1);
  const y0 = Math.max(0, Math.floor(ui.camY / (TILE * scale)) - 1);
  const x1 = Math.min(MAP_W - 1, Math.ceil((ui.camX + W) / (TILE * scale)) + 1);
  const y1 = Math.min(MAP_H - 1, Math.ceil((ui.camY + H) / (TILE * scale)) + 1);

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const ter = state.map.terrain[y * MAP_W + x];
    const sx = x * TILE * scale - ui.camX, sy = y * TILE * scale - ui.camY;
    if (ter === 'water') Spr.drawSprite(ctx, Spr.autotileName('water', waterMask(x, y)), sx, sy, scale);
    else {
      Spr.drawSprite(ctx, grassKey, sx, sy, scale);
      if (ter === 'city') { ctx.fillStyle = 'rgba(200,180,140,0.15)'; ctx.fillRect(sx, sy, TILE * scale, TILE * scale); }
    }
  }
  for (const p of state.map.paths) {
    if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
    Spr.drawSprite(ctx, 'path_full', p.x * TILE * scale - ui.camX, p.y * TILE * scale - ui.camY, scale);
  }
  for (const b of state.buildings) {
    if (b.type !== 'farm_wheat') continue;
    const phase = Math.min(3, Math.floor((state.month % 3 + state.day / 30) % 4));
    for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) {
      Spr.drawSprite(ctx, 'wheat_field_' + phase, (b.x+dx)*TILE*scale - ui.camX, (b.y+dy)*TILE*scale - ui.camY, scale);
    }
  }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!state.map.roads[y * MAP_W + x]) continue;
    Spr.drawSprite(ctx, Spr.autotileName('road', roadMask(x, y)), x*TILE*scale - ui.camX, y*TILE*scale - ui.camY, scale);
  }

  const entities = [];
  const now = performance.now();
  for (const t of state.map.trees) {
    entities.push({ z: t.y + 1, x: t.x, draw: () => { drawShadow(t.x, t.y, 1, 1); drawSpritePivot('tree_' + t.v, t.x, t.y, 1, 1); }});
  }
  for (const h of state.map.houses) {
    if (!h.active) continue;
    entities.push({ z: h.y + 2, x: h.x, draw: () => { drawShadow(h.x, h.y, 2, 2); drawSpritePivot('house_' + h.v, h.x, h.y, 2, 2); }});
  }
  for (const b of state.buildings) {
    const d = BUILD_DEFS[b.type];
    entities.push({ z: b.y + d.h, x: b.x, draw: () => {
      drawShadow(b.x, b.y, d.w, d.h);
      let name = d.sprite;
      if (d.anim) name = Spr.animFrame(d.anim, now) || name;
      drawSpritePivot(name, b.x, b.y, d.w, d.h);
      if (b.blocked || b.missing) {
        const sx = (b.x + d.w / 2) * TILE * scale - ui.camX - 8 * scale;
        const sy = b.y * TILE * scale - ui.camY - 4 * scale;
        Spr.drawSprite(ctx, b.blocked ? 'icon_full' : 'icon_missing', sx, sy, scale);
      }
      if (ui.selectedId === b.id) {
        ctx.strokeStyle = Spr.PALETTE.gold; ctx.lineWidth = 2;
        ctx.strokeRect(b.x*TILE*scale - ui.camX, b.y*TILE*scale - ui.camY, d.w*TILE*scale, d.h*TILE*scale);
      }
    }});
  }
  for (const t of state.trucks) {
    entities.push({ z: t.fy + 1, x: t.fx, draw: () => {
      const fr = Math.floor(now / 160) % 2;
      const key = Spr.truckKey(t.dir, t.cargo || 'empty', fr);
      const sx = t.fx * TILE * scale + (TILE * scale - 28 * scale) / 2 - ui.camX;
      const sy = t.fy * TILE * scale + TILE * scale - 28 * scale - ui.camY;
      Spr.drawSprite(ctx, key, sx, sy, scale);
    }});
  }
  entities.sort((a, b) => a.z - b.z || a.x - b.x);
  for (const e of entities) e.draw();

  if (season === 'winter') {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (state.map.terrain[y * MAP_W + x] === 'water') continue;
      ctx.globalAlpha = 0.55;
      Spr.drawSprite(ctx, 'snow_overlay', x*TILE*scale - ui.camX, y*TILE*scale - ui.camY, scale);
      ctx.globalAlpha = 1;
    }
  }

  if (ui.tool && ui.tool !== 'demolish' && ui.tool !== 'route' && ui.hoverTx >= 0) {
    const d = BUILD_DEFS[ui.tool];
    if (d) {
      const ok = canBuild(ui.tool, ui.hoverTx, ui.hoverTy);
      ctx.globalAlpha = 0.5;
      if (ui.tool === 'road') {
        ctx.fillStyle = ok ? 'rgba(100,200,100,0.5)' : 'rgba(200,80,80,0.5)';
        ctx.fillRect(ui.hoverTx*TILE*scale - ui.camX, ui.hoverTy*TILE*scale - ui.camY, TILE*scale, TILE*scale);
      } else if (d.sprite) {
        drawSpritePivot(d.sprite, ui.hoverTx, ui.hoverTy, d.w, d.h);
        ctx.fillStyle = ok ? 'rgba(100,200,100,0.25)' : 'rgba(200,80,80,0.35)';
        ctx.fillRect(ui.hoverTx*TILE*scale - ui.camX, ui.hoverTy*TILE*scale - ui.camY, d.w*TILE*scale, d.h*TILE*scale);
      }
      ctx.globalAlpha = 1;
    }
  }
  if (ui.tool === 'demolish' && ui.hoverTx >= 0) {
    ctx.fillStyle = 'rgba(217,87,74,0.35)';
    ctx.fillRect(ui.hoverTx*TILE*scale - ui.camX, ui.hoverTy*TILE*scale - ui.camY, TILE*scale, TILE*scale);
  }
  if (ui.tool === 'shop') {
    for (const s of state.map.shopSlots) {
      ctx.strokeStyle = Spr.PALETTE.gold; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.strokeRect(s.x*TILE*scale - ui.camX, s.y*TILE*scale - ui.camY, 2*TILE*scale, 2*TILE*scale);
      ctx.setLineDash([]);
    }
  }

  for (let i = ui.effects.length - 1; i >= 0; i--) {
    const e = ui.effects[i];
    const age = now - e.t0;
    if (age > e.life) { ui.effects.splice(i, 1); continue; }
    const p = age / e.life;
    const sx = e.x * scale - ui.camX;
    const sy = e.y * scale - ui.camY - (e.type === 'coin' ? p * 30 * scale : 0);
    if (e.type === 'dust') Spr.drawSprite(ctx, Spr.animFrame('dust', age) || 'dust_0', sx, sy, scale);
    else if (e.type === 'coin') Spr.drawSprite(ctx, 'plus_money', sx, sy, scale);
    else if (e.type === 'confetti') Spr.drawSprite(ctx, Spr.animFrame('confetti', age) || 'confetti_0', sx, sy, scale);
  }

  drawHUD();
  drawBottomBar();
  if (ui.panel === 'finance') drawFinancePanel();
  if (ui.panel === 'milestones') drawMilestonesPanel();
  if (ui.panel === 'settings') drawSettingsPanel();
  if (ui.panel === 'route') drawRoutePanel();
  if (ui.selectedId != null) drawBuildingPanel();
  if (ui.helpOpen) drawHelp();
  if (state.victory) drawOverlay('Vítězství!', 'Hodnota firmy přesáhla 100 000 $. Můžeš hrát dál.', 'Pokračovat', () => { state.victory = false; });
  if (state.bankrupt) drawOverlay('Bankrot', 'Hotovost byla příliš dlouho pod −10 000 $.', 'Načíst zálohu', () => { loadGame(); state.bankrupt = false; });

  if (ui.toast && now < ui.toastT) {
    ctx.fillStyle = 'rgba(46,42,58,0.9)';
    ctx.font = '14px monospace';
    const tw = Math.min(W - 40, ctx.measureText(ui.toast).width + 40);
    ctx.fillRect((W - tw) / 2, H - 100, tw, 36);
    ctx.fillStyle = '#F2E6C9';
    ctx.textAlign = 'center';
    ctx.fillText(ui.toast, W / 2, H - 76);
    ctx.textAlign = 'left';
  }
  if (ui.menuOpen) drawMenu();
}

}

function drawBottomBar() {
  const Spr = S(), W = canvas.width, H = canvas.height, barH = 72;

  for (const c of cats) {
    ctx.fillStyle = ui.buildCat === c.id ? Spr.PALETTE.gold : Spr.PALETTE.ui_mid;
    ctx.fillRect(cx, H - barH + 6, 64, 22);
    ctx.fillStyle = Spr.PALETTE.ui_dark; ctx.textAlign = 'center';
    ctx.fillText(c.label, cx + 32, H - barH + 21); cx += 68;
  }
  const tools = [{id:'demolish',label:'X Demolice'},{id:'route',label:'T Trasy'},{id:'finance',label:'F Finance'},{id:'milestones',label:'Cíle'}];
  cx = W - 420;
  for (const t of tools) {
    const active = ui.tool === t.id || ui.panel === t.id;
    ctx.fillStyle = active ? Spr.PALETTE.gold : Spr.PALETTE.ui_mid;
    ctx.fillRect(cx, H - barH + 6, 96, 22);

    const d = BUILD_DEFS[k];

    return d.cat === ui.buildCat;

    const d = BUILD_DEFS[type];

    ctx.fillStyle = ui.tool === type ? Spr.PALETTE.gold : (locked ? '#3a3545' : Spr.PALETTE.ui_mid);
    ctx.fillRect(cx, H - 40, 110, 32);

function panelBox(x, y, w, h, title) {
  const Spr = S();
  ctx.fillStyle = 'rgba(46,42,58,0.95)'; ctx.strokeStyle = Spr.PALETTE.gold; ctx.lineWidth = 2;

  ctx.fillText('×', x + w - 18, y + 23); ctx.textAlign = 'left';
}

function avgSat(p) {
  const h = state.stats.satHistory[p];
  if (!h || !h.length) return 0.5;
  return h.reduce((a, b) => a + b, 0) / h.length;
}

function drawBuildingPanel() {
  const b = state.buildings.find(x => x.id === ui.selectedId);
  if (!b) { ui.selectedId = null; return; }
  const d = BUILD_DEFS[b.type], W = canvas.width;
  const pw = 280, ph = b.type === 'shop' ? 320 : (b.type === 'depot' ? 260 : 240);
  const px = W - pw - 12, py = 52;
  panelBox(px, py, pw, ph, d.name);
  ctx.fillStyle = S().PALETTE.cream; ctx.font = '12px monospace';
  let ly = py + 44;
  ctx.fillText('Údržba: ' + fmtMoney(d.maint) + '/měs', px + 12, ly); ly += 18;
  if (d.out) { ctx.fillText('Výstup: ' + PRODUCT_NAMES[d.out] + ' ' + Math.floor(b.storage[d.out]||0) + '/' + (d.storageOut||''), px+12, ly); ly += 18; }
  if (d.in) { ctx.fillText('Vstup: ' + PRODUCT_NAMES[d.in] + ' ' + Math.floor(b.storage[d.in]||0) + '/' + d.storageIn, px+12, ly); ly += 18; }
  if (d.storageAll) {
    for (const p of Object.keys(b.storage)) {
      if ((b.storage[p]||0) > 0 || (d.sells && d.sells.includes(p))) {
        ctx.fillText(PRODUCT_NAMES[p] + ': ' + Math.floor(b.storage[p]||0), px+12, ly); ly += 16;
      }
    }
    ctx.fillText('Celkem: ' + storageTotal(b) + '/' + d.storageAll, px+12, ly); ly += 18;
  }
  if (b.riverBonus) { ctx.fillStyle = S().PALETTE.profit; ctx.fillText('Bonus řeky ×1,2', px+12, ly); ly += 18; ctx.fillStyle = S().PALETTE.cream; }
  if (b.blocked) { ctx.fillStyle = S().PALETTE.loss; ctx.fillText('Sklad plný — výroba stojí!', px+12, ly); ly += 18; }
  if (b.missing) { ctx.fillStyle = S().PALETTE.loss; ctx.fillText('Chybí vstupní surovina', px+12, ly); ly += 18; }
  if (b.type === 'shop') {
    ctx.fillStyle = S().PALETTE.gold; ctx.fillText('Ceny (násobek základní):', px+12, ly); ly += 20;
    for (const p of ['bread','eggs','milk']) {
      ctx.fillStyle = S().PALETTE.cream;
      ctx.fillText(PRODUCT_NAMES[p] + ' ' + Math.round(state.prices[p]*100) + '%', px+12, ly);
      ctx.fillStyle = S().PALETTE.ui_mid;
      ctx.fillRect(px+160, ly-12, 24, 20); ctx.fillRect(px+190, ly-12, 24, 20);
      ctx.fillStyle = S().PALETTE.cream; ctx.textAlign = 'center';
      ctx.fillText('−', px+172, ly+2); ctx.fillText('+', px+202, ly+2); ctx.textAlign = 'left';
      const sat = avgSat(p);
      const smile = sat < 0.4 ? 'icon_smile_sad' : sat < 0.75 ? 'icon_smile_ok' : 'icon_smile_happy';
      S().drawSprite(ctx, smile, px+230, ly-14, 1); ly += 26;
    }
  }
  if (b.type === 'depot') {
    ctx.fillStyle = S().PALETTE.cream;
    ctx.fillText('Náklaďáky: ' + state.trucks.filter(t => t.depotId === b.id).length, px+12, ly); ly += 24;
    ctx.fillStyle = S().PALETTE.gold; ctx.fillRect(px+12, ly, 160, 28);
    ctx.fillStyle = S().PALETTE.ui_dark; ctx.font = '12px monospace';
    ctx.fillText('Koupit auto (' + fmtMoney(BALANCE.truckPrice) + ')', px+20, ly+18);
  }
}

function drawFinancePanel() {
  const W = canvas.width, pw = 340, ph = 280, px = (W-pw)/2, py = 60;
  panelBox(px, py, pw, ph, 'Finance');
  ctx.fillStyle = S().PALETTE.cream; ctx.font = '12px monospace';
  ctx.fillText('Hotovost: ' + fmtMoney(state.cash), px+12, py+48);
  ctx.fillText('Hodnota firmy: ' + fmtMoney(companyValue(state)), px+12, py+68);
  ctx.fillText('Příjem tento měsíc: ' + fmtMoney(state.stats.monthIncome), px+12, py+88);
  ctx.fillText('Poslední zisk: ' + fmtMoney(state.stats.lastMonthProfit), px+12, py+108);
  ctx.fillText('Posledních 12 měsíců (zisk):', px+12, py+140);
  const hist = state.stats.history, chartY = py+240, chartH = 80, chartX = px+20;
  if (hist.length) {
    const maxAbs = Math.max(1000, ...hist.map(h => Math.abs(h.profit)));
    const bw = Math.floor(300/12);
    hist.forEach((h, i) => {
      const bh = (h.profit / maxAbs) * chartH * 0.45;
      ctx.fillStyle = h.profit >= 0 ? S().PALETTE.profit : S().PALETTE.loss;
      if (bh >= 0) ctx.fillRect(chartX + i*bw, chartY - 40 - bh, bw-2, bh);
      else ctx.fillRect(chartX + i*bw, chartY - 40, bw-2, -bh);
    });
    ctx.strokeStyle = S().PALETTE.cream; ctx.beginPath();
    ctx.moveTo(chartX, chartY-40); ctx.lineTo(chartX+300, chartY-40); ctx.stroke();
  } else ctx.fillText('(zatím žádná historie)', px+12, py+160);
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' '); let line = '';
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, y); y += lineH; line = w + ' '; }
    else line = test;
  }
  ctx.fillText(line, x, y);
}

function drawOverlay(title, msg, btn, cb) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  const pw = 360, ph = 180, px = (W-pw)/2, py = (H-ph)/2;
  panelBox(px, py, pw, ph, title);
  ctx.fillStyle = S().PALETTE.cream; ctx.font = '13px monospace';
  wrapText(msg, px+16, py+60, pw-32, 18);
  ctx.fillStyle = S().PALETTE.gold; ctx.fillRect(px+(pw-140)/2, py+ph-50, 140, 32);
  ctx.fillStyle = S().PALETTE.ui_dark; ctx.textAlign = 'center';
  ctx.fillText(btn, px+pw/2, py+ph-28); ctx.textAlign = 'left';
  ui._overlayCb = cb;
}

function drawMenu() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(20,18,28,0.92)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = S().PALETTE.gold; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Malý magnát', W/2, H/2 - 100);
  ctx.fillStyle = S().PALETTE.cream; ctx.font = '14px monospace';
  ctx.fillText('Útulná budovatelská ekonomika', W/2, H/2 - 70);
  const buttons = [];
  if (hasSave()) buttons.push({ id: 'continue', label: 'Pokračovat' });
  buttons.push({ id: 'new_normal', label: 'Nová hra (Normální)' });
  buttons.push({ id: 'new_easy', label: 'Nová hra (Snadná)' });
  buttons.push({ id: 'new_hard', label: 'Nová hra (Těžká)' });
  buttons.forEach((b, i) => {
    const bx = W/2 - 120, by = H/2 - 30 + i*44;
    ctx.fillStyle = S().PALETTE.ui_mid; ctx.fillRect(bx, by, 240, 36);
    ctx.fillStyle = S().PALETTE.cream; ctx.fillText(b.label, W/2, by+24);
  });
  ctx.textAlign = 'left';
  ui._menuButtons = buttons.map((b, i) => ({ ...b, x: W/2-120, y: H/2-30+i*44, w: 240, h: 36 }));
}

function hitHUD(mx, my) {
  const W = canvas.width, H = canvas.height;
  if (my < 44) {
    let bx = W - 280;
    for (const v of [0, 1, 2, 4]) {
      if (mx >= bx && mx < bx + 36 && my >= 8 && my < 36) { state.speed = v; sfxClick(); return true; }
      bx += 40;
    }
    if (mx >= W - 90 && mx < W - 54) { ui.panel = ui.panel === 'settings' ? null : 'settings'; sfxClick(); return true; }
    if (mx >= W - 48 && mx < W - 12) { ui.helpOpen = !ui.helpOpen; sfxClick(); return true; }
    return true;
  }
  if (my > H - 72) {
    let cx = 8;
    for (const c of ['prod', 'proc', 'log', 'shop', 'road']) {
      if (mx >= cx && mx < cx + 64 && my >= H - 66 && my < H - 44) { ui.buildCat = c; sfxClick(); return true; }
      cx += 68;
    }
    cx = W - 420;
    for (const t of ['demolish', 'route', 'finance', 'milestones']) {
      if (mx >= cx && mx < cx + 96 && my >= H - 66 && my < H - 44) {
        if (t === 'demolish') { ui.tool = ui.tool === 'demolish' ? null : 'demolish'; ui.panel = null; }
        else if (t === 'route') { ui.panel = ui.panel === 'route' ? null : 'route'; ui.tool = ui.panel === 'route' ? 'route' : null; ui.routeDraft = null; }
        else { ui.panel = ui.panel === t ? null : t; ui.tool = null; }
        sfxClick(); return true;
      }
      cx += 100;
    }
    const list = Object.keys(BUILD_DEFS).filter(k => {
      const d = BUILD_DEFS[k];
      if (ui.buildCat === 'road') return k === 'road';
      if (ui.buildCat === 'shop') return k === 'shop';
      return d.cat === ui.buildCat;
    });
    cx = 8;
    for (const type of list) {
      if (mx >= cx && mx < cx + 110 && my >= H - 40 && my < H - 8) {
        const d = BUILD_DEFS[type];
        if (d.unlock && !state.unlocked[d.unlock]) { toast('Zatím odemčeno milníkem'); sfxError(); return true; }
        ui.tool = ui.tool === type ? null : type; ui.selectedId = null; sfxClick(); return true;
      }
      cx += 114;
    }
    return true;
  }
  return false;
}

function hitPanel(mx, my) {
  const W = canvas.width, H = canvas.height;
  if (ui.helpOpen) {
    const pw = 420, ph = 360, px = (W-pw)/2, py = (H-ph)/2;
    if (mx >= px+pw-28 && mx < px+pw-8 && my >= py+8 && my < py+28) { ui.helpOpen = false; return true; }
    if (mx >= px && mx <= px+pw && my >= py && my <= py+ph) return true;
    ui.helpOpen = false; return true;
  }
  if (state && (state.victory || state.bankrupt) && ui._overlayCb) {
    const pw = 360, ph = 180, px = (W-pw)/2, py = (H-ph)/2;
    if (mx >= px+(pw-140)/2 && mx <= px+(pw+140)/2 && my >= py+ph-50 && my <= py+ph-18) {
      ui._overlayCb(); ui._overlayCb = null; sfxClick(); return true;
    }
    return true;
  }
  if (ui.panel === 'settings') {
    const pw = 300, ph = 220, px = (W-pw)/2, py = 80;
    if (mx >= px+pw-28 && mx <= px+pw-8 && my >= py+8 && my <= py+28) { ui.panel = null; return true; }
    let ly = py + 50;
    for (const k of ['music','sfx','mute','save','menu']) {
      if (mx >= px+20 && mx <= px+280 && my >= ly-14 && my <= ly+14) {
        if (k === 'music') { ui.musicOn = !ui.musicOn; if (ui.musicOn) startMusic(); else stopMusic(); }
        else if (k === 'sfx') ui.sfxOn = !ui.sfxOn;
        else if (k === 'mute') { ui.muted = !ui.muted; if (ui.muted) stopMusic(); else startMusic(); }
        else if (k === 'save') saveGame();
        else if (k === 'menu') { saveGame(true); ui.menuOpen = true; ui.panel = null; stopMusic(); }
        sfxClick(); return true;
      }
      ly += 36;
    }
    if (mx >= px && mx <= px+pw && my >= py && my <= py+ph) return true;
  }
  if (ui.panel === 'finance' || ui.panel === 'milestones') {
    const pw = ui.panel === 'finance' ? 340 : 360;
    const ph = ui.panel === 'finance' ? 280 : 300;
    const px = (W-pw)/2, py = 60;
    if (mx >= px+pw-28 && mx <= px+pw-8 && my >= py+8 && my <= py+28) { ui.panel = null; return true; }
    if (mx >= px && mx <= px+pw && my >= py && my <= py+ph) return true;
  }
  if (ui.panel === 'route') {
    const pw = 360, ph = 340, px = 12, py = 52;
    if (mx >= px+pw-28 && mx <= px+pw-8 && my >= py+8 && my <= py+28) {
      ui.panel = null; ui.tool = null; ui.routeDraft = null; return true;
    }
    let ly = py + 80;
    for (const t of state.trucks) {
      if (mx >= px+12 && mx <= px+348 && my >= ly-12 && my <= ly+10) {
        ui.routeDraft = { truckId: t.id }; sfxClick(); return true;
      }
      ly += 26;
      if (ui.routeDraft && ui.routeDraft.truckId === t.id) {
        ly += (t.route ? t.route.length : 0) * 16;
        if (my >= ly && my <= ly+22) {
          if (mx >= px+20 && mx <= px+120) { t.route = []; toast('Trasa smazána'); }
          else if (mx >= px+130 && mx <= px+230) t.waitFull = !t.waitFull;
          else if (mx >= px+240 && mx <= px+340) { ui.routeDraft = null; ui.tool = null; ui.panel = null; checkMilestones(); }
          sfxClick(); return true;
        }
        ly += 30;
      }
    }
    if (mx >= px && mx <= px+pw && my >= py && my <= py+ph) return true;
  }
  if (ui.selectedId != null) {
    const b = state.buildings.find(x => x.id === ui.selectedId);
    if (b) {
      const d = BUILD_DEFS[b.type];
      const pw = 280, ph = b.type === 'shop' ? 320 : (b.type === 'depot' ? 260 : 240);
      const px = W - pw - 12, py = 52;
      if (mx >= px+pw-28 && mx <= px+pw-8 && my >= py+8 && my <= py+28) { ui.selectedId = null; return true; }
      if (b.type === 'shop') {
        let ly = py + 44 + 18;
        if (d.storageAll) {
          for (const p of Object.keys(b.storage)) {
            if ((b.storage[p]||0) > 0 || (d.sells && d.sells.includes(p))) ly += 16;
          }
          ly += 18;
        }
        ly += 20;
        for (const p of ['bread','eggs','milk']) {
          if (my >= ly-12 && my <= ly+8) {
            if (mx >= px+160 && mx < px+184) {
              state.prices[p] = Math.max(0.5, Math.round((state.prices[p]-0.05)*100)/100); sfxClick(); return true;
            }
            if (mx >= px+190 && mx < px+214) {
              state.prices[p] = Math.min(2.0, Math.round((state.prices[p]+0.05)*100)/100); sfxClick(); return true;
            }
          }
          ly += 26;
        }
      }
      if (b.type === 'depot') {
        let ly = py + 44 + 18 + 24;
        if (mx >= px+12 && mx <= px+172 && my >= ly && my <= ly+28) { buyTruck(b); return true; }
      }
      if (mx >= px && mx <= px+pw && my >= py && my <= py+ph) return true;
    }
  }
  return false;
}

function onPointerDown(mx, my, button) {
  ensureAudio();
  if (ui.menuOpen) {
    if (!ui._menuButtons) return;
    for (const b of ui._menuButtons) {
      if (mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) {
        sfxClick();
        if (b.id === 'continue') loadGame();
        else if (b.id === 'new_easy') newGame('easy');
        else if (b.id === 'new_hard') newGame('hard');
        else newGame('normal');
        return;
      }
    }
    return;
  }
  if (!state) return;
  if (button === 2) { ui.tool = null; ui.panel = null; ui.selectedId = null; ui.routeDraft = null; return; }
  if (hitPanel(mx, my)) return;
  if (hitHUD(mx, my)) return;
  const { tx, ty } = screenToTile(mx, my);

  if (ui.tool === 'route' && ui.routeDraft) {
    const b = buildingAt(tx, ty);
    if (b) {
      const t = state.trucks.find(x => x.id === ui.routeDraft.truckId);
      if (t) {
        if (!t.route) t.route = [];
        if (t.route.length >= 4) { toast('Max 4 zastávky'); sfxError(); return; }
        const d = BUILD_DEFS[b.type];
        let action = 'unload', product = null;
        if (d.cat === 'prod' || d.cat === 'proc') { action = 'load'; product = d.out; }
        else if (b.type === 'warehouse') { action = 'load'; product = 'wheat'; }
        t.route.push({ bId: b.id, action, product });
        if (t.route.length >= 2) {
          const prev = t.route[t.route.length - 2];
          if (prev.action === 'load') {
            t.route[t.route.length - 1].action = 'unload';
            t.route[t.route.length - 1].product = null;
          }
        }
        toast('Zastávka přidána'); sfxClick(); checkMilestones();
      }
    }
    return;
  }
  if (ui.tool === 'demolish') { ui.drag = { mode: 'demolish', lastTx: tx, lastTy: ty }; demolishAt(tx, ty); return; }
  if (ui.tool === 'road') { ui.drag = { mode: 'road', lastTx: tx, lastTy: ty }; placeBuilding('road', tx, ty); return; }
  if (ui.tool && BUILD_DEFS[ui.tool] && ui.tool !== 'road') { placeBuilding(ui.tool, tx, ty); return; }

  const b = buildingAt(tx, ty);
  if (b) { ui.selectedId = b.id; ui.panel = null; sfxClick(); return; }
  for (const t of state.trucks) {
    if (Math.abs(t.fx - tx) < 1 && Math.abs(t.fy - ty) < 1) {
      ui.panel = 'route'; ui.tool = 'route'; ui.routeDraft = { truckId: t.id }; sfxClick(); return;
    }
  }
  ui.selectedId = null;
  ui.drag = { mode: 'pan', sx: mx, sy: my, camX: ui.camX, camY: ui.camY };
}

function onPointerMove(mx, my) {
  if (!state || ui.menuOpen) return;
  const { tx, ty } = screenToTile(mx, my);
  ui.hoverTx = tx; ui.hoverTy = ty;
  if (!ui.drag) return;
  if (ui.drag.mode === 'pan') {
    ui.camX = ui.drag.camX - (mx - ui.drag.sx);
    ui.camY = ui.drag.camY - (my - ui.drag.sy);
    clampCam();
  } else if (ui.drag.mode === 'road') {
    if (tx !== ui.drag.lastTx || ty !== ui.drag.lastTy) {
      let x = ui.drag.lastTx, y = ui.drag.lastTy;
      const dx = Math.sign(tx - x), dy = Math.sign(ty - y);
      while (x !== tx || y !== ty) {
        if (x !== tx) x += dx; else if (y !== ty) y += dy;
        placeBuilding('road', x, y);
      }
      ui.drag.lastTx = tx; ui.drag.lastTy = ty;
    }
  } else if (ui.drag.mode === 'demolish') {
    if (tx !== ui.drag.lastTx || ty !== ui.drag.lastTy) {
      demolishAt(tx, ty); ui.drag.lastTx = tx; ui.drag.lastTy = ty;
    }
  }
}
function onPointerUp() { ui.drag = null; }

function onWheel(e) {
  e.preventDefault();
  const mx = e.offsetX, my = e.offsetY;
  const before = screenToWorld(mx, my);
  if (e.deltaY < 0) ui.zoom = Math.min(3, ui.zoom + 1);
  else ui.zoom = Math.max(1, ui.zoom - 1);
  const after = screenToWorld(mx, my);
  ui.camX += (before.x - after.x) * ui.zoom;
  ui.camY += (before.y - after.y) * ui.zoom;
  clampCam();
}

function onKey(e, down) {
  const k = e.key.toLowerCase();
  if (down) ui.keys[k] = true; else { ui.keys[k] = false; return; }
  if (k === 'escape') {
    if (ui.helpOpen) { ui.helpOpen = false; return; }
    if (ui.tool || ui.panel || ui.selectedId) { ui.tool = null; ui.panel = null; ui.selectedId = null; ui.routeDraft = null; }
    else ui.panel = 'settings';
    return;
  }
  if (ui.menuOpen || !state) return;
  if (k === ' ' || k === 'spacebar') { e.preventDefault(); state.speed = state.speed === 0 ? 1 : 0; return; }
  if (k === '+' || k === '=') { const i = BALANCE.speeds.indexOf(state.speed); state.speed = BALANCE.speeds[Math.min(BALANCE.speeds.length-1, i+1)]; }
  if (k === '-' || k === '_') { const i = BALANCE.speeds.indexOf(state.speed); state.speed = BALANCE.speeds[Math.max(0, i-1)]; }
  if (k === 'm') { ui.muted = !ui.muted; if (ui.muted) stopMusic(); else startMusic(); }
  if (k === 'r') { ui.tool = 'road'; ui.buildCat = 'road'; }
  if (k === 'x') ui.tool = ui.tool === 'demolish' ? null : 'demolish';
  if (k === 't') { ui.panel = 'route'; ui.tool = 'route'; }
  if (k === 'f') ui.panel = ui.panel === 'finance' ? null : 'finance';
  if (k === '1') ui.buildCat = 'prod';
  if (k === '2') ui.buildCat = 'proc';
  if (k === '3') ui.buildCat = 'log';
  if (k === '4') ui.buildCat = 'shop';
  if (k === '5') ui.buildCat = 'road';
}

function updateCamFromKeys(dt) {
  if (!state || ui.menuOpen) return;
  const sp = 300 * dt;
  if (ui.keys['w'] || ui.keys['arrowup']) ui.camY -= sp;
  if (ui.keys['s'] || ui.keys['arrowdown']) ui.camY += sp;
  if (ui.keys['a'] || ui.keys['arrowleft']) ui.camX -= sp;
  if (ui.keys['d'] || ui.keys['arrowright']) ui.camX += sp;
  clampCam();
}

function frame(ts) {
  const dt = Math.min(0.05, (ts - lastFrame) / 1000 || 0);
  lastFrame = ts;
  updateCamFromKeys(dt);
  if (state && !ui.menuOpen && !state.bankrupt && state.speed > 0) {
    accumDay += dt * state.speed;
    while (accumDay >= 1) { accumDay -= 1; tickDay(); }
  }
  render();
  requestAnimationFrame(frame);
}

function resize() {
  const r = wrap.getBoundingClientRect();
  canvas.width = Math.floor(r.width);
  canvas.height = Math.floor(r.height);
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  ctx.imageSmoothingEnabled = false;
  clampCam();
}

function bindInput() {
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => onPointerDown(e.offsetX, e.offsetY, e.button));
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    onPointerMove(e.clientX - rect.left, e.clientY - rect.top);
  });
  window.addEventListener('mouseup', () => onPointerUp());
  canvas.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('keydown', e => onKey(e, true));
  window.addEventListener('keyup', e => onKey(e, false));

  let touchPan = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); ensureAudio();
    if (e.touches.length === 1) {
      const rect = canvas.getBoundingClientRect();
      const mx = e.touches[0].clientX - rect.left, my = e.touches[0].clientY - rect.top;
      ui._longPress = { x: mx, y: my, t0: performance.now(), moved: false };
      if (ui.tool === 'road' || ui.tool === 'demolish') onPointerDown(mx, my, 0);
      else touchPan = { x: mx, y: my, camX: ui.camX, camY: ui.camY };
    } else if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      ui._pinch = { d, zoom: ui.zoom }; touchPan = null;
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    if (e.touches.length === 2 && ui._pinch) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      ui.zoom = Math.max(1, Math.min(3, Math.round(ui._pinch.zoom * d / ui._pinch.d)));
      clampCam(); return;
    }
    if (e.touches.length === 1) {
      const mx = e.touches[0].clientX - rect.left, my = e.touches[0].clientY - rect.top;
      if (ui._longPress && Math.hypot(mx - ui._longPress.x, my - ui._longPress.y) > 10) ui._longPress.moved = true;
      if (ui.tool === 'road' || ui.tool === 'demolish') onPointerMove(mx, my);
      else if (touchPan) {
        ui.camX = touchPan.camX - (mx - touchPan.x);
        ui.camY = touchPan.camY - (my - touchPan.y);
        clampCam();
      }
    }
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (ui._longPress && !ui._longPress.moved) {
      const held = performance.now() - ui._longPress.t0;
      const mx = ui._longPress.x, my = ui._longPress.y;
      if (held > 500) {
        const { tx, ty } = screenToTile(mx, my);
        const b = buildingAt(tx, ty);
        if (b) { ui.selectedId = b.id; sfxClick(); }
      } else onPointerDown(mx, my, 0);
    }
    ui._longPress = null; ui._pinch = null; touchPan = null; onPointerUp();
  }, { passive: false });
}

function init() {
  wrap = document.getElementById('game-wrap');
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  bindInput();
  if (window.matchMedia && window.matchMedia('(max-width: 800px)').matches) ui.zoom = 1;
  S().preload().then(() => requestAnimationFrame(frame));
}

window.MalyMagnatGame = {
  init, newGame, loadGame, saveGame, hasSave,
  getState: () => state, getUI: () => ui, tickDay,
  DEFAULTS, BALANCE, BUILD_DEFS, placeBuilding, canBuild
};
})();

</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.MalyMagnatGame) MalyMagnatGame.init();
});
</script>
