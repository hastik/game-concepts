<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vlak — testovací replika</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
      padding: 0.6rem 1rem;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #toolbar .title {
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #f0c040;
    }

    #toolbar .stat {
      font-size: 0.875rem;
      color: #bbb;
    }

    #toolbar .stat strong {
      color: #eee;
      font-weight: 600;
    }

    #toolbar .hint {
      margin-left: auto;
      font-size: 0.8rem;
      color: #666;
    }

    #stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
    }

    #canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    #overlay.visible { display: flex; }

    #overlay .msg {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      padding: 1rem 1.5rem;
      color: #fff;
      text-shadow: 0 2px 0 #000;
    }

    #overlay.crash .msg { color: #ff6b6b; }
    #overlay.win .msg { color: #7dffa0; }
    #overlay.done .msg { color: #f0c040; }

    #overlay .sub {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #ccc;
      text-transform: none;
    }
  </style>
</head>
<body>
  <header id="toolbar">
    <span class="title">VLAK</span>
    <span class="stat">Level <strong id="levelName">START</strong></span>
    <span class="stat">Předměty <strong id="itemCount">0 / 0</strong></span>
    <span class="hint">Šipky / WASD · R restart</span>
  </header>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="overlay"><div class="msg" id="overlayMsg"></div></div>
  </div>
  <script>
    const COLS = 20;
    const ROWS = 12;
    const CELL = 16;
    const TICK_MS = 165;
    const CRASH_MS = 900;
    const WIN_MS = 900;

    const DIRS = {
      up:    { x: 0, y: -1, key: "up" },
      down:  { x: 0, y: 1, key: "down" },
      left:  { x: -1, y: 0, key: "left" },
      right: { x: 1, y: 0, key: "right" },
    };

    const OPPOSITE = {
      up: "down", down: "up", left: "right", right: "left",
    };

    const ITEM_COLORS = {
      A: { body: "#5ec8ff", accent: "#c8f0ff" }, // crystal
      B: { body: "#f0c040", accent: "#fff0a0" }, // crown
      C: { body: "#4caf50", accent: "#8b5a2b" }, // tree
      D: { body: "#e74c3c", accent: "#7d3c2b" }, // apple
      E: { body: "#fff8e7", accent: "#c49a6c" }, // cow
    };

    const LEVELS = [
      {
        name: "START",
        map: [
          "####################",
          "#..................#",
          "#..A..........B....#",
          "#..................#",
          "#........$.........#",
          "#..................#",
          "#..................#",
          "#..C..........D....#",
          "#..................#",
          "#.........@........#",
          "#..................#",
          "####################",
        ],
      },
      {
        name: "ROHY",
        map: [
          "####################",
          "#$.......##.......A#",
          "#........##........#",
          "#........##........#",
          "#..................#",
          "####............####",
          "####............####",
          "#..................#",
          "#........##........#",
          "#B.......##.......C#",
          "#........@.........#",
          "####################",
        ],
      },
      {
        name: "KRIZ",
        map: [
          "####################",
          "#$....#......#....A#",
          "#.....#..##..#.....#",
          "#.....#..##..#.....#",
          "#...........B......#",
          "###.####....####.###",
          "###.####....####.###",
          "#......C...........#",
          "#.....#..##..#.....#",
          "#D....#..##..#....E#",
          "#.....#..@...#.....#",
          "####################",
        ],
      },
      {
        name: "BLUD",
        map: [
          "####################",
          "#$A#....#....#....B#",
          "#.##.##.#.##.#.##.##",
          "#....#....#....#...#",
          "####.#.####.####.#.#",
          "#....#......C....#.#",
          "#.####.######.####.#",
          "#.#....#....#......#",
          "#.#.####.##.#.####.#",
          "#D#......##......E@#",
          "#..................#",
          "####################",
        ],
      },
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");
    const overlay = document.getElementById("overlay");
    const overlayMsg = document.getElementById("overlayMsg");
    const levelNameEl = document.getElementById("levelName");
    const itemCountEl = document.getElementById("itemCount");

    const pxW = COLS * CELL;
    const pxH = ROWS * CELL;

    let levelIndex = 0;
    let walls;
    let items;
    let gate;
    let train;
    let pendingDir = null;
    let state = "play"; // play | crash | win | done
    let totalItems = 0;
    let animPhase = 0;
    let lastTick = 0;
    let stateUntil = 0;
    let scale = 1;

    function parseLevel(def) {
      const w = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      const itemMap = new Map();
      let loco = null;
      let gatePos = null;
      let count = 0;

      for (let y = 0; y < ROWS; y++) {
        const row = def.map[y];
        for (let x = 0; x < COLS; x++) {
          const ch = row[x];
          if (ch === "#") {
            w[y][x] = true;
          } else if (ch === "$") {
            loco = { x, y };
          } else if (ch === "@") {
            gatePos = { x, y };
          } else if (ITEM_COLORS[ch]) {
            itemMap.set(key(x, y), ch);
            count++;
          }
        }
      }

      if (!loco || !gatePos) throw new Error("Level missing loco or gate: " + def.name);

      return {
        walls: w,
        items: itemMap,
        gate: gatePos,
        train: {
          parts: [{ x: loco.x, y: loco.y, kind: "loco" }],
          dir: "right",
        },
        totalItems: count,
      };
    }

    function key(x, y) {
      return x + "," + y;
    }

    function loadLevel(index) {
      levelIndex = index;
      const parsed = parseLevel(LEVELS[index]);
      walls = parsed.walls;
      items = parsed.items;
      gate = parsed.gate;
      train = parsed.train;
      totalItems = parsed.totalItems;
      pendingDir = null;
      state = "play";
      stateUntil = 0;
      animPhase = 0;
      lastTick = performance.now();
      hideOverlay();
      updateHud();
    }

    function updateHud() {
      levelNameEl.textContent = LEVELS[levelIndex].name;
      const remaining = items.size;
      if (remaining === 0 && state === "play") {
        itemCountEl.textContent = "brána otevřena";
      } else {
        itemCountEl.textContent = remaining + " / " + totalItems;
      }
    }

    function showOverlay(kind, html) {
      overlay.className = "visible " + kind;
      overlayMsg.innerHTML = html;
    }

    function hideOverlay() {
      overlay.className = "";
      overlayMsg.innerHTML = "";
    }

    function resize() {
      const rect = stage.getBoundingClientRect();
      const pad = 16;
      const availW = Math.max(1, rect.width - pad * 2);
      const availH = Math.max(1, rect.height - pad * 2);
      scale = Math.max(1, Math.floor(Math.min(availW / pxW, availH / pxH)));
      canvas.width = pxW;
      canvas.height = pxH;
      canvas.style.width = pxW * scale + "px";
      canvas.style.height = pxH * scale + "px";
      ctx.imageSmoothingEnabled = false;
    }

    function occupiedByTrain(x, y, skipTail) {
      const n = train.parts.length;
      for (let i = 0; i < n; i++) {
        if (skipTail && i === n - 1) continue;
        const p = train.parts[i];
        if (p.x === x && p.y === y) return true;
      }
      return false;
    }

    function trySetDir(next) {
      if (state !== "play") return;
      if (OPPOSITE[train.dir] === next && train.parts.length > 1) return;
      pendingDir = next;
    }

    function step() {
      if (state !== "play") return;

      if (pendingDir) {
        if (!(OPPOSITE[train.dir] === pendingDir && train.parts.length > 1)) {
          train.dir = pendingDir;
        }
        pendingDir = null;
      }

      const d = DIRS[train.dir];
      const head = train.parts[0];
      const nx = head.x + d.x;
      const ny = head.y + d.y;

      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || walls[ny][nx]) {
        crash();
        return;
      }

      const grow = items.has(key(nx, ny));
      const skipTail = !grow;

      if (occupiedByTrain(nx, ny, skipTail)) {
        crash();
        return;
      }

      if (nx === gate.x && ny === gate.y) {
        if (items.size === 0) {
          enterGate();
          return;
        }
        // Gate blocked until all items collected — treat as wall
        crash();
        return;
      }

      let cargo = null;
      if (grow) {
        cargo = items.get(key(nx, ny));
        items.delete(key(nx, ny));
      }

      const newParts = [{ x: nx, y: ny, kind: "loco" }];
      if (grow) {
        newParts.push({
          x: train.parts[0].x,
          y: train.parts[0].y,
          kind: "wagon",
          cargo,
        });
        for (let i = 1; i < train.parts.length; i++) {
          const src = train.parts[i];
          newParts.push({
            x: src.x,
            y: src.y,
            kind: "wagon",
            cargo: src.cargo,
          });
        }
      } else {
        for (let i = 0; i < train.parts.length - 1; i++) {
          newParts.push({
            x: train.parts[i].x,
            y: train.parts[i].y,
            kind: "wagon",
            cargo: train.parts[i + 1].cargo,
          });
        }
      }
      train.parts = newParts;

      updateHud();
    }

    function crash() {
      state = "crash";
      stateUntil = performance.now() + CRASH_MS;
      showOverlay("crash", "Náraz!<span class=\"sub\">restart levelu…</span>");
    }

    function enterGate() {
      if (levelIndex >= LEVELS.length - 1) {
        state = "done";
        stateUntil = performance.now() + 2200;
        showOverlay("done", "Hotovo!<span class=\"sub\">R — hrát znovu</span>");
      } else {
        state = "win";
        stateUntil = performance.now() + WIN_MS;
        showOverlay("win", "Level hotov!<span class=\"sub\">další scéna…</span>");
      }
    }

    // ---- Drawing ----

    function fillRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawCellBg(x, y) {
      const px = x * CELL;
      const py = y * CELL;
      const checker = (x + y) % 2 === 0;
      fillRect(px, py, CELL, CELL, checker ? "#1c2430" : "#18202a");
    }

    function drawWall(x, y) {
      const px = x * CELL;
      const py = y * CELL;
      fillRect(px, py, CELL, CELL, "#3a4558");
      fillRect(px + 1, py + 1, CELL - 2, CELL - 2, "#4a5670");
      fillRect(px + 2, py + 2, 4, 4, "#6a7898");
      fillRect(px + 10, py + 2, 4, 4, "#6a7898");
      fillRect(px + 2, py + 10, 4, 4, "#2e3648");
      fillRect(px + 10, py + 10, 4, 4, "#2e3648");
    }

    function drawGate(x, y, open) {
      const px = x * CELL;
      const py = y * CELL;
      fillRect(px, py, CELL, CELL, "#152018");
      fillRect(px + 2, py + 1, 3, CELL - 2, open ? "#7dffa0" : "#445544");
      fillRect(px + 11, py + 1, 3, CELL - 2, open ? "#7dffa0" : "#445544");
      fillRect(px + 5, py + 1, 6, 2, open ? "#a8ffc8" : "#556655");
      fillRect(px + 5, py + CELL - 3, 6, 2, open ? "#a8ffc8" : "#556655");
      if (open && animPhase % 2 === 0) {
        fillRect(px + 6, py + 5, 4, 6, "#c8ffe0");
      }
    }

    function drawItem(x, y, type) {
      const px = x * CELL;
      const py = y * CELL;
      const c = ITEM_COLORS[type];
      const bob = animPhase % 2;

      if (type === "A") {
        // crystal
        fillRect(px + 7, py + 2 + bob, 2, 12, c.body);
        fillRect(px + 4, py + 5 + bob, 8, 6, c.body);
        fillRect(px + 6, py + 6 + bob, 2, 2, c.accent);
      } else if (type === "B") {
        // crown
        fillRect(px + 3, py + 8 + bob, 10, 5, c.body);
        fillRect(px + 3, py + 5 + bob, 2, 3, c.body);
        fillRect(px + 7, py + 4 + bob, 2, 4, c.body);
        fillRect(px + 11, py + 5 + bob, 2, 3, c.body);
        fillRect(px + 7, py + 3 + bob, 2, 2, c.accent);
      } else if (type === "C") {
        // tree
        fillRect(px + 7, py + 9, 2, 5, c.accent);
        fillRect(px + 4, py + 3 + bob, 8, 7, c.body);
        fillRect(px + 6, py + 2 + bob, 4, 2, c.body);
      } else if (type === "D") {
        // apple
        fillRect(px + 4, py + 5 + bob, 8, 8, c.body);
        fillRect(px + 7, py + 3 + bob, 2, 3, c.accent);
        fillRect(px + 6, py + 7 + bob, 2, 2, "#ffaaaa");
      } else {
        // cow
        fillRect(px + 3, py + 6 + bob, 10, 6, c.body);
        fillRect(px + 11, py + 4 + bob, 3, 4, c.body);
        fillRect(px + 3, py + 12 + bob, 2, 2, c.accent);
        fillRect(px + 9, py + 12 + bob, 2, 2, c.accent);
        fillRect(px + 12, py + 5 + bob, 1, 1, "#222");
      }
    }

    function drawLoco(x, y, dir) {
      const px = x * CELL;
      const py = y * CELL;
      fillRect(px + 2, py + 4, 12, 8, "#e8a020");
      fillRect(px + 3, py + 5, 10, 6, "#f0c040");
      fillRect(px + 4, py + 2, 4, 3, "#c87810");
      fillRect(px + 2, py + 12, 3, 2, "#333");
      fillRect(px + 11, py + 12, 3, 2, "#333");

      // cabin window + facing light
      if (dir === "right") {
        fillRect(px + 10, py + 6, 3, 3, "#7ec8ff");
        fillRect(px + 14, py + 7, 2, 2, "#fff8a0");
      } else if (dir === "left") {
        fillRect(px + 3, py + 6, 3, 3, "#7ec8ff");
        fillRect(px, py + 7, 2, 2, "#fff8a0");
      } else if (dir === "up") {
        fillRect(px + 6, py + 3, 3, 3, "#7ec8ff");
        fillRect(px + 7, py, 2, 2, "#fff8a0");
      } else {
        fillRect(px + 6, py + 8, 3, 3, "#7ec8ff");
        fillRect(px + 7, py + 14, 2, 2, "#fff8a0");
      }
    }

    function drawWagon(x, y, cargo) {
      const px = x * CELL;
      const py = y * CELL;
      fillRect(px + 2, py + 5, 12, 7, "#8b5a2b");
      fillRect(px + 3, py + 6, 10, 5, "#a86b35");
      fillRect(px + 2, py + 12, 3, 2, "#333");
      fillRect(px + 11, py + 12, 3, 2, "#333");
      fillRect(px + 1, py + 7, 1, 3, "#666");
      fillRect(px + 14, py + 7, 1, 3, "#666");

      if (cargo && ITEM_COLORS[cargo]) {
        const c = ITEM_COLORS[cargo];
        fillRect(px + 5, py + 7, 6, 4, c.body);
        fillRect(px + 6, py + 8, 2, 2, c.accent);
      }
    }

    function draw() {
      ctx.imageSmoothingEnabled = false;
      fillRect(0, 0, pxW, pxH, "#0a0a0a");

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          drawCellBg(x, y);
          if (walls[y][x]) drawWall(x, y);
        }
      }

      const gateOpen = items.size === 0;
      drawGate(gate.x, gate.y, gateOpen);

      for (const [k, type] of items) {
        const [sx, sy] = k.split(",").map(Number);
        drawItem(sx, sy, type);
      }

      // draw wagons then loco on top
      for (let i = train.parts.length - 1; i >= 0; i--) {
        const p = train.parts[i];
        if (p.kind === "loco") drawLoco(p.x, p.y, train.dir);
        else drawWagon(p.x, p.y, p.cargo);
      }

      if (state === "crash") {
        ctx.fillStyle = "rgba(180, 40, 40, 0.25)";
        ctx.fillRect(0, 0, pxW, pxH);
      }
    }

    function frame(now) {
      if (state === "play") {
        if (now - lastTick >= TICK_MS) {
          lastTick += TICK_MS;
          if (now - lastTick > TICK_MS) lastTick = now;
          step();
          animPhase++;
        }
      } else if (state === "crash") {
        if (now >= stateUntil) loadLevel(levelIndex);
      } else if (state === "win") {
        if (now >= stateUntil) loadLevel(levelIndex + 1);
      } else if (state === "done") {
        // wait for R
      }

      draw();
      requestAnimationFrame(frame);
    }

    function onKey(e) {
      const k = e.key.toLowerCase();
      if (k === "arrowup" || k === "w") { e.preventDefault(); trySetDir("up"); }
      else if (k === "arrowdown" || k === "s") { e.preventDefault(); trySetDir("down"); }
      else if (k === "arrowleft" || k === "a") { e.preventDefault(); trySetDir("left"); }
      else if (k === "arrowright" || k === "d") { e.preventDefault(); trySetDir("right"); }
      else if (k === "r") {
        e.preventDefault();
        if (state === "done") loadLevel(0);
        else loadLevel(levelIndex);
      }
    }

    window.addEventListener("keydown", onKey);
    window.addEventListener("resize", resize);

    resize();
    loadLevel(0);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
